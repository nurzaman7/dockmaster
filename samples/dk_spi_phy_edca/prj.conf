CONFIG_DOCKMASTER=y
CONFIG_SPI=y
CONFIG_GPIO=y

# Tier 0 backend (PPI + EGU) and the two logic-analyser probe pins.
CONFIG_DM_TIER_HW_NRF=y
CONFIG_DM_GPIO_PROBES=y

# Spec section 15: prove the stack sizes on target.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y

CONFIG_LOG=y
CONFIG_DM_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_MAIN_THREAD_PRIORITY=8
CONFIG_ASSERT=y
