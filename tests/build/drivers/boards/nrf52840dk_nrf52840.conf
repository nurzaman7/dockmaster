# Minimum for net_pkt allocation by the 802.15.4 link, with Dockmaster as
# the radio's only user: networking core plus the radio in raw mode
# (net_pkt.c is all that is built of the net stack).
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y

# Tier 0 on PPI.
CONFIG_DM_TIER_HW_NRF=y
